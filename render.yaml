# Render Blueprint: Render reads this file when you choose New > Blueprint and pick this repo.
services:
  - type: web
    name: northbridge-admissions-agent
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.9
      - key: GOOGLE_API_KEY
        sync: false          # Render asks you to paste the key; it is never stored in the repo
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: GEMINI_BACKUP_MODELS
        value: gemini-3.1-flash-lite,gemini-3.6-flash
      - key: DEMO_MODE
        value: "1"
      - key: DAILY_LIMIT
        value: "40"
      - key: VISITOR_LIMIT_PER_HOUR
        value: "5"
